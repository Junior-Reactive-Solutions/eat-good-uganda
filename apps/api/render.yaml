services:
  - type: web
    name: eatgood-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: |
      cd ../.. && pnpm install --frozen-lockfile && \
      pnpm --filter @eatgood/api build
    startCommand: pnpm --filter @eatgood/api start
    healthCheckPath: /v1/internal/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_CUSTOMER_SECRET
        sync: false
      - key: JWT_BAKERY_SECRET
        sync: false
      - key: JWT_SUPERADMIN_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: SUPERADMIN_IP_ALLOWLIST
        value: ""
      - key: CORS_ORIGINS
        value: https://eatgooduganda.com,https://bakery.eatgooduganda.com,https://admin.eatgooduganda.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        value: eatgood_unsigned
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: no-reply@eatgooduganda.com
      - key: RESEND_REPLY_TO
        value: support@eatgooduganda.com
      - key: PUBLIC_CUSTOMER_URL
        value: https://eatgooduganda.com
      - key: PUBLIC_BAKERY_ADMIN_URL
        value: https://bakery.eatgooduganda.com
      - key: PUBLIC_SUPERADMIN_URL
        value: https://admin.eatgooduganda.com
      - key: PUBLIC_API_URL
        value: https://eatgood-api.onrender.com
      - key: MTN_MOMO_SANDBOX_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_SANDBOX_USER_ID
        sync: false
      - key: MTN_MOMO_SANDBOX_API_KEY
        sync: false
      - key: MTN_MOMO_CALLBACK_HOST
        value: https://eatgood-api.onrender.com
      - key: MTN_MOMO_TARGET_ENV
        value: production
      - key: AIRTEL_SANDBOX_CLIENT_ID
        sync: false
      - key: AIRTEL_SANDBOX_CLIENT_SECRET
        sync: false
      - key: AIRTEL_TARGET_ENV
        value: production
      - key: AIRTEL_COUNTRY
        value: UG
      - key: AIRTEL_CURRENCY
        value: UGX
      - key: WEBHOOK_HMAC_SECRET
        sync: false
      - key: SWAGGER_BASIC_AUTH
        sync: false
      - key: KEEPALIVE_PING_URL
        value: https://eatgood-api.onrender.com/v1/internal/health
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 300
      - key: RATE_LIMIT_AUTH_MAX
        value: 10
      - key: SENTRY_DSN
        sync: false
