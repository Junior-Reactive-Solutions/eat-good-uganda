name: API Integration Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eatgooduganda_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations on test database
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/eatgooduganda_test
        run: pnpm --filter @eatgood/db migrate

      - name: Run API integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/eatgooduganda_test
          NODE_ENV: test
        run: pnpm --filter @eatgood/api test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/test-results/
          retention-days: 7
          if-no-files-found: ignore
