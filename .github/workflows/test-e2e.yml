name: E2E Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL to test against (e.g., https://customer.vercel.app)'
        required: false
        type: string

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Determine preview URL
        id: preview
        run: |
          if [ -z "${{ inputs.preview_url }}" ]; then
            # Try to get preview URL from Vercel deployment
            echo "url=http://localhost:5173" >> $GITHUB_OUTPUT
            echo "Using local development URL"
          else
            echo "url=${{ inputs.preview_url }}" >> $GITHUB_OUTPUT
            echo "Using provided preview URL: ${{ inputs.preview_url }}"
          fi

      - name: Check if PR is WIP
        id: wip
        run: |
          if echo "${{ github.event.pull_request.title }}" | grep -qi "WIP"; then
            echo "is_wip=true" >> $GITHUB_OUTPUT
            echo "PR title contains WIP - E2E tests will be skipped"
          else
            echo "is_wip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run E2E tests
        if: steps.wip.outputs.is_wip != 'true'
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm --filter @eatgood/customer test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/customer/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Print test summary
        if: always()
        run: |
          if [ -d "apps/customer/test-results" ]; then
            echo "Test results:"
            cat apps/customer/test-results/results.json || true
          fi
